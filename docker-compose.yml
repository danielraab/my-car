# Reference topology for my-cars: the single application image (Go
# backend serving the embedded frontend) plus its PostgreSQL database.
#
# Local development:
#   docker compose up -d db        # just the database; run `go run .` on the host
#   docker compose up --build      # the whole stack
#
# This same shape is what CI runs (a postgres service container) and what a
# production deployment mirrors.

services:
  db:
    image: postgres:17
    profiles:
      - "dev"
      - "prod"
    environment:
      POSTGRES_USER: mycars
      POSTGRES_PASSWORD: mycars
      POSTGRES_DB: mycars
    ports:
      # Exposed so a host-side `go run .` can use the DATABASE_URL from
      # backend/.env.example. Not required for the containerised app.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycars -d mycars"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
#    image: ghcr.io/danielraab/my-cars:latest
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - "prod"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://mycars:mycars@db:5432/mycars?sslmode=disable
      SMTP_FROM: "admin@example.com"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS: none
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      AUTH_BASE_URL: http://localhost:8080
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RATE_LIMIT_PER_IP: ${RATE_LIMIT_PER_IP:-true}
      ANALYTICS_SNIPPET: ${ANALYTICS_SNIPPET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_REQUESTS: ${LOG_REQUESTS:-all}
      # Attachments are stored on the files volume by default. For S3, set
      # FILE_STORAGE=s3 and the S3_* variables (see backend/.env.example).
      FILE_STORAGE: ${FILE_STORAGE:-local}
      FILE_STORAGE_PATH: /data/files
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-false}
      S3_PREFIX: ${S3_PREFIX:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "8080:8080"
    volumes:
      # Back this up together with pgdata: it holds the attachment files.
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy




  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   profiles:
  #     - "dev"
  #     - "dev-only"
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@example.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #     PGADMIN_CONFIG_SERVER_MODE: "False"
  #   ports:
  #     - "8081:80" # web UI (8080 on the host is the app's port)
  #   volumes:
  #     - pgadmin-dev:/var/lib/pgadmin
  #   depends_on:
  #     db:
  #       condition: service_healthy

  dbgate:
    image: dbgate/dbgate:latest
    profiles:
      - "dev"
      - "dev-only"
    environment:
      # Preconfigured connection to the compose database.
      CONNECTIONS: mycars
      LABEL_mycars: my-cars (local)
      ENGINE_mycars: postgres@dbgate-plugin-postgres
      SERVER_mycars: db
      PORT_mycars: "5432"
      USER_mycars: mycars
      PASSWORD_mycars: mycars
      DATABASE_mycars: mycars
    ports:
      - "8082:3000" # web UI (3000 on the host is the Vite dev server)
    volumes:
      - dbgate-dev:/root/.dbgate
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    profiles:
      - "dev"
      - "dev-only"
    environment:
      # Accept mail with or without auth and over plain connections — this is a
      # throwaway local catcher, never a real relay.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI + API
    volumes:
      - mailpit-dev:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles:
      - "dev"
      - "dev-only"
    # Local S3-compatible storage for trying FILE_STORAGE=s3. The my-cars
    # bucket is created by pre-creating its directory. Backend settings:
    #   FILE_STORAGE=s3 S3_ENDPOINT=http://localhost:9000 S3_BUCKET=my-cars
    #   S3_ACCESS_KEY_ID=mycars S3_SECRET_ACCESS_KEY=mycars-secret
    #   S3_USE_PATH_STYLE=true
    entrypoint: ["sh", "-c", "mkdir -p /data/my-cars && exec minio server /data --console-address :9001"]
    environment:
      MINIO_ROOT_USER: mycars
      MINIO_ROOT_PASSWORD: mycars-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  files:
  minio-dev:
  pgadmin-dev:
  dbgate-dev:
  cloudbeaver-dev:
  mailpit-dev:
