          - diesel
          - gasoline
          - electric
        firstRegistration:
          type:
          - string
          - 'null'
          format: date
        licensePlate:
          type:
          - string
          - 'null'
        fin:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        purchaseDate:
          type:
