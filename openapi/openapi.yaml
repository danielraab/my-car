    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    CarFilter:
      name: carId
      in: query
      schema:
        $ref: '#/components/schemas/UUID'
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    FromRequired:
      name: from
      in: query
      required: true
      description: Inclusive start of the range.
      schema:
        type: string
        format: date-time
    ToRequired:
      name: to
      in: query
      required: true
      description: Exclusive end of the range.
      schema:
        type: string
        format: date-time
    ReturnTo:
      name: returnTo
      in: query
      schema:
        type: string
        format: uri-reference
  headers:
    RequestId:
      description: Server-generated ID of this request, also recorded in the backend's log entries for it. Present on every response.
      schema:
        type: string
        pattern: ^[0-9a-f]{16}$
  responses:
    Redirect:
      description: Redirect to the identity provider.
    SessionRedirect:
      description: Session established and redirect to an allowed frontend path.
      headers:
        Set-Cookie:
          schema:
            type: string
          description: HttpOnly Secure SameSite session cookie.
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource absent or not owned by caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AttachmentLimitReached:
      description: The entry already has the maximum number of attachments
        (10); the error code is `attachment_limit_reached`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FileTooLarge:
      description: The file exceeds the maximum upload size; the error code is
        `file_too_large`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: The file content is not a JPEG, PNG, WebP or GIF image or a
        PDF document; the error code is `unsupported_media_type`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ReauthenticationRequired:
      description: The session is older than the fresh-login window (5 minutes);
        the error code is `reauthentication_required`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests from this client; the error code is
        `rate_limited`. Sign-in endpoints are limited per client address.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimitedRedirect:
      description: Too many requests from this client; the browser is sent to
        `/auth/login?error=rate_limited`.
      headers:
        Location:
          description: Always `/auth/login?error=rate_limited`.
          schema:
            type: string
    ServerError:
      description: Unexpected server error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
