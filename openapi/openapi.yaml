  schemas:
    UUID:
      type: string
      format: uuid
    Decimal:
      type: string
      pattern: ^-?[0-9]+(\.[0-9]+)?$
    NullableDecimal:
      type:
      - string
      - 'null'
      pattern: ^-?[0-9]+(\.[0-9]+)?$
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: validation_failed
        message:
          type: string
        fields:
          type: object
          description: Validation details keyed by request member name (`_body`
            for the request as a whole). Values are machine-readable reasons,
            such as `read_only` (the member cannot be changed), `unknown` (the
            member is not part of the request schema), `invalid_type` (wrong
            JSON type), `too_long` (exceeds the documented maximum length),
            `required` (a required member is missing), `empty` (a string is
            blank after trimming), `invalid_enum` (not one of the documented
            codes), `invalid_date` (not an RFC 3339 full-date),
            `invalid_decimal` (not a decimal string), `negative` (a
            numeric value below zero), and `before_first_registration` (a
            deregistration date earlier than the car's first registration).
          additionalProperties:
            type: string
    Profile:
      type: object
      required:
      - id
      - email
      - firstName
      - lastName
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
    ProfileUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
    Session:
      type: object
      required:
      - profile
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
    AuthenticationMethods:
      type: object
      required:
      - methods
      properties:
        methods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - magic_link
            - oidc
            - passkey
    PasskeySummary:
      type: object
      required:
      - id
      - name
      - createdAt
      - lastUsedAt
      - authenticatorName
      - backedUp
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
        authenticatorName:
          type:
          - string
          - 'null'
          description: Authenticator model name derived from its AAGUID, or
            `null` when unknown.
        backedUp:
          type: boolean
          description: Whether the passkey is synced (backed up) across devices.
    PasskeyList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PasskeySummary'
    PasskeyName:
      type: string
      minLength: 1
      maxLength: 100
      description: Trimmed before validation; must not be blank.
    PasskeyRegistration:
      type: object
      additionalProperties: false
      required:
      - name
      - credential
      properties:
        name:
          $ref: '#/components/schemas/PasskeyName'
        credential:
          $ref: '#/components/schemas/PublicKeyCredentialJSON'
    PasskeyUpdate:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/PasskeyName'
    PasskeyCreationOptions:
      type: object
      required:
      - publicKey
      properties:
        publicKey:
          type: object
          description: W3C WebAuthn `PublicKeyCredentialCreationOptionsJSON`
            (binary members base64url-encoded).
          additionalProperties: true
    PasskeyRequestOptions:
      type: object
      required:
      - publicKey
      properties:
        publicKey:
          type: object
          description: W3C WebAuthn `PublicKeyCredentialRequestOptionsJSON`
            (binary members base64url-encoded).
          additionalProperties: true
    PublicKeyCredentialJSON:
      type: object
      description: W3C WebAuthn `RegistrationResponseJSON` or
        `AuthenticationResponseJSON` (binary members base64url-encoded).
      required:
      - id
      - rawId
      - type
      - response
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum:
          - public-key
        response:
          type: object
          additionalProperties: true
      additionalProperties: true
    MagicLinkRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
        returnTo:
          type: string
          format: uri-reference
    CarInput:
      type: object
      additionalProperties: false
      required:
      - type
      - make
      - name
      - fuel
      properties:
        type:
          type: string
        make:
          type: string
        name:
          type: string
        fuel:
          type: string
          enum:
          - other
          - diesel
          - gasoline
          - electric
        firstRegistration:
          type:
          - string
          - 'null'
          format: date
        licensePlate:
          type:
          - string
          - 'null'
        fin:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
          default: true
        purchaseDate:
          type:
          - string
          - 'null'
          format: date
        purchasePrice:
          $ref: '#/components/schemas/NullableDecimal'
        deregistrationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the car was deregistered; it must not be earlier
            than `firstRegistration` when both are recorded
            (`before_first_registration`). Independent of `isActive`.
        information:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Free-form, possibly multi-line notes about the car.
    CarUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        type:
          type: string
        make:
          type: string
        name:
          type: string
        fuel:
          type: string
          enum:
          - other
          - diesel
          - gasoline
          - electric
        firstRegistration:
          type:
          - string
          - 'null'
          format: date
        licensePlate:
          type:
          - string
          - 'null'
        fin:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        purchaseDate:
          type:
          - string
          - 'null'
          format: date
        purchasePrice:
          $ref: '#/components/schemas/NullableDecimal'
        deregistrationDate:
          type:
          - string
          - 'null'
          format: date
          description: Date the car was deregistered; it must not be earlier
            than `firstRegistration` when both are recorded
            (`before_first_registration`). Independent of `isActive`.
        information:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Free-form, possibly multi-line notes about the car.
    Car:
      type: object
      description: A car. Every member is always present;
        `firstRegistration`, `licensePlate`, `fin`, `purchaseDate`,
        `purchasePrice`, `deregistrationDate`, and `information` are `null`
        when not recorded.
      required:
      - id
