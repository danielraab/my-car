openapi: 3.1.0
info:
  title: my-car API
  version: 2.2.0
  description: REST API for the my-car rewrite.
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: /api/v1
security:
- cookieSession: []
paths:
  /auth/methods:
    get:
      tags:
      - Authentication
      security: []
      operationId: getAuthenticationMethods
      responses:
        '200':
          description: Passwordless authentication methods enabled for this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationMethods'
        default:
          $ref: '#/components/responses/ServerError'
  /auth/oidc/start:
    get:
      tags:
      - Authentication
      security: []
      operationId: startOidcLogin
      parameters:
      - $ref: '#/components/parameters/ReturnTo'
      responses:
        '302':
          $ref: '#/components/responses/Redirect'
        '303':
          $ref: '#/components/responses/RateLimitedRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/oidc/callback:
    get:
      tags:
      - Authentication
      security: []
      operationId: completeOidcLogin
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          $ref: '#/components/responses/SessionRedirect'
        '303':
          $ref: '#/components/responses/RateLimitedRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/magic-links:
    post:
      tags:
      - Authentication
      security: []
      operationId: requestMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      description: Sends a sign-in link unless the address already received 3
        within the last 15 minutes; that case is answered with the same `202`
        and no email, so the response never reveals anything about the address.
      responses:
        '202':
          description: Request accepted without revealing account existence.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/magic-links/{token}:
    get:
      tags:
      - Authentication
      security: []
      operationId: consumeMagicLink
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '302':
          $ref: '#/components/responses/SessionRedirect'
        '303':
          $ref: '#/components/responses/RateLimitedRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/passkey/options:
    post:
      tags:
      - Authentication
      security: []
      operationId: startPasskeyLogin
      description: Starts a discoverable-credential passkey login. No email is
        accepted or revealed. The returned options contain no allowed-credential
        list and require user verification. A short-lived HttpOnly ceremony
        cookie correlates the options with the following assertion.
      responses:
        '200':
          description: WebAuthn request options in their JSON form.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly Secure SameSite=Strict passkey ceremony cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRequestOptions'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ServerError'
  /auth/passkey:
    post:
      tags:
      - Authentication
      security: []
      operationId: completePasskeyLogin
      description: Verifies a passkey assertion for the ceremony started by
        `startPasskeyLogin` and establishes a session for the account that owns
        the credential. Never creates an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicKeyCredentialJSON'
      responses:
        '204':
          description: Session established.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly Secure SameSite session cookie.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/ServerError'
  /session:
    get:
      tags:
      - Authentication
      operationId: getSession
      responses:
        '200':
          description: Current authenticated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Authentication
      operationId: logout
      responses:
        '204':
          description: Session invalidated and cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
  /passkeys:
    get:
      tags:
      - Passkeys
      operationId: listPasskeys
      responses:
        '200':
          description: The caller's passkeys ordered by creation time then ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Passkeys
      operationId: registerPasskey
      description: Completes the registration ceremony started by
        `startPasskeyRegistration`. Requires a session established at most
        5 minutes ago.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistration'
      responses:
        '201':
          description: Registered passkey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReauthenticationRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/ServerError'
  /passkeys/registration-options:
    post:
      tags:
      - Passkeys
      operationId: startPasskeyRegistration
      description: Starts registering a discoverable passkey for the caller.
        Requires a session established at most 5 minutes ago. The caller's
        existing passkeys are excluded. A short-lived HttpOnly ceremony cookie
        correlates the options with the following registration.
      responses:
        '200':
          description: WebAuthn creation options in their JSON form.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly Secure SameSite=Strict passkey ceremony cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyCreationOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ReauthenticationRequired'
        default:
          $ref: '#/components/responses/ServerError'
  /passkeys/{passkeyId}:
    parameters:
    - $ref: '#/components/parameters/PasskeyId'
    patch:
      tags:
      - Passkeys
      operationId: renamePasskey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyUpdate'
      responses:
        '200':
          description: Renamed passkey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Passkeys
      operationId: deletePasskey
      description: Deletes the passkey and revokes every session established
        with it, including the caller's session if it was. In that case the
        session cookie is cleared. No fresh login is required.
      responses:
        '204':
          description: Passkey deleted and its sessions revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /me:
    get:
      tags:
      - Profile
      operationId: getMe
      responses:
        '200':
          description: Current profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
      - Profile
      operationId: updateMe
      description: Updates the caller's first and/or last name. Names are trimmed
        and may be empty. The email address is read-only; a body containing
        `email` is rejected with `400` and a `read_only` reason for `email`,
        and nothing is applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
  /cars:
    get:
      tags:
      - Cars
      operationId: listCars
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cars ordered by creation time then ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Cars
      operationId: createCar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarInput'
      responses:
        '201':
          description: Created car.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Car'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
  /cars/{carId}:
    parameters:
    - $ref: '#/components/parameters/CarId'
    get:
      tags:
      - Cars
      operationId: getCar
      responses:
        '200':
          description: Car.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Car'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
      - Cars
      operationId: updateCar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarUpdate'
      responses:
        '200':
          description: Updated car.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Car'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Cars
      operationId: deleteCar
      responses:
        '204':
          description: Car and associated expenses deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'
  /refuels:
    get:
      tags:
      - Expenses
      operationId: listRefuels
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/CarFilter'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: The caller's refuels ordered by date then ID. A `carId`
            that names no car of the caller's yields an empty page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefuelPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
    post:
      $ref: '#/components/pathItems/RefuelCreate/post'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
  /refuels/{refuelId}:
    parameters:
    - $ref: '#/components/parameters/RefuelId'
    get:
      $ref: '#/components/pathItems/RefuelDetail/get'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
    patch:
      $ref: '#/components/pathItems/RefuelDetail/patch'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      $ref: '#/components/pathItems/RefuelDetail/delete'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
  /refuels/stations:
    get:
      tags:
      - Expenses
      operationId: listRefuelStations
      responses:
        '200':
          description: Distinct station names from the caller's refuels, in ascending order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
  /refuels/chart:
    get:
      tags:
      - Expenses
      operationId: getRefuelChart
      parameters:
      - $ref: '#/components/parameters/CarFilter'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Complete chart series ordered by date then ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefuelChart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
  /repairs:
    get:
      tags:
      - Expenses
      operationId: listRepairs
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/CarFilter'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: The caller's repairs ordered by date then ID. A `carId`
            that names no car of the caller's yields an empty page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
    post:
      $ref: '#/components/pathItems/RepairCreate/post'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
  /repairs/{repairId}:
    parameters:
    - $ref: '#/components/parameters/RepairId'
    get:
      $ref: '#/components/pathItems/RepairDetail/get'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
    patch:
      $ref: '#/components/pathItems/RepairDetail/patch'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      $ref: '#/components/pathItems/RepairDetail/delete'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
  /repairs/stations:
    get:
      tags:
      - Expenses
      operationId: listRepairStations
      responses:
        '200':
          description: Distinct station names from the caller's repairs, in
            ascending order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
  /tickets:
    get:
      tags:
      - Expenses
      operationId: listTickets
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/CarFilter'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: The caller's tickets ordered by date then ID. A `carId`
            that names no car of the caller's yields an empty page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
    post:
      $ref: '#/components/pathItems/TicketCreate/post'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
  /tickets/{ticketId}:
    parameters:
    - $ref: '#/components/parameters/TicketId'
    get:
      $ref: '#/components/pathItems/TicketDetail/get'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
    patch:
      $ref: '#/components/pathItems/TicketDetail/patch'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
    delete:
      $ref: '#/components/pathItems/TicketDetail/delete'
      responses:
        default:
          $ref: '#/components/responses/ServerError'
  /tickets/locations:
    get:
      tags:
      - Expenses
      operationId: listTicketLocations
      responses:
        '200':
          description: Distinct locations from the caller's tickets, in
            ascending order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
  /stats/expenses:
    get:
      tags:
      - Expenses
      operationId: getExpenseStatistics
      parameters:
      - $ref: '#/components/parameters/FromRequired'
      - $ref: '#/components/parameters/ToRequired'
      - $ref: '#/components/parameters/CarFilter'
      responses:
        '200':
          description: The caller's refuels, repairs and tickets dated on or
            after `from` and before `to`, ordered by date, unpaged. They are
            not grouped into days or months, because only the client knows
            the viewer's time zone. A `carId` that names no car of the
            caller's yields no rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseStatistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: my_car_session
      description: HttpOnly, Secure, SameSite session cookie issued only by the backend.
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from nextCursor.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CarId:
      name: carId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    PasskeyId:
      name: passkeyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    RefuelId:
      name: refuelId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    RepairId:
      name: repairId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    CarFilter:
      name: carId
      in: query
      schema:
        $ref: '#/components/schemas/UUID'
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    FromRequired:
      name: from
      in: query
      required: true
      description: Inclusive start of the range.
      schema:
        type: string
        format: date-time
    ToRequired:
      name: to
      in: query
      required: true
      description: Exclusive end of the range.
      schema:
        type: string
        format: date-time
    ReturnTo:
      name: returnTo
      in: query
      schema:
        type: string
        format: uri-reference
  responses:
    Redirect:
      description: Redirect to the identity provider.
    SessionRedirect:
      description: Session established and redirect to an allowed frontend path.
      headers:
        Set-Cookie:
          schema:
            type: string
          description: HttpOnly Secure SameSite session cookie.
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource absent or not owned by caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ReauthenticationRequired:
      description: The session is older than the fresh-login window (5 minutes);
        the error code is `reauthentication_required`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests from this client; the error code is
        `rate_limited`. Sign-in endpoints are limited per client address.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimitedRedirect:
      description: Too many requests from this client; the browser is sent to
        `/auth/login?error=rate_limited`.
      headers:
        Location:
          description: Always `/auth/login?error=rate_limited`.
          schema:
            type: string
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  pathItems:
    RefuelCreate:
      post:
        tags:
        - Expenses
        operationId: createRefuel
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefuelInput'
        responses:
          '201':
            description: Created refuel.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Refuel'
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '404':
            $ref: '#/components/responses/NotFound'
          default:
            $ref: '#/components/responses/ServerError'
    RepairCreate:
      post:
        tags:
        - Expenses
        operationId: createRepair
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairInput'
        responses:
          '201':
            description: Created repair.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Repair'
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '404':
            $ref: '#/components/responses/NotFound'
          default:
            $ref: '#/components/responses/ServerError'
    TicketCreate:
      post:
        tags:
        - Expenses
        operationId: createTicket
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketInput'
        responses:
          '201':
            description: Created ticket.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Ticket'
